<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 240" role="img" aria-label="SANJI" preserveAspectRatio="xMidYMid meet">
  <rect width="690" height="240" fill="#0E0E0E"/>

  <defs>
    <!-- Letter spines (centerline paths) -->
    <path id="ltr-s" d="M 140 75 C 140 40, 40 40, 40 80 C 40 110, 140 110, 140 160 C 140 200, 40 200, 40 165"/>
    <path id="ltr-a" d="M 175 200 L 240 40 L 305 200"/>
    <path id="ltr-n" d="M 340 200 L 340 40 L 460 200 L 460 40"/>
    <path id="ltr-j" d="M 560 40 L 560 165 C 560 200, 500 200, 500 165"/>
    <path id="ltr-i" d="M 635 40 L 635 200"/>
  </defs>

  <!-- Concentric stroke stack creates the inline (parallel-line) effect.
       6 layers of alternating white/black = 3 visible white grooves per stroke. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6">
    <g stroke="#FFFFFF" stroke-width="24">
      <use href="#ltr-s"/><use href="#ltr-a"/><use href="#ltr-n"/><use href="#ltr-j"/><use href="#ltr-i"/>
    </g>
    <g stroke="#0E0E0E" stroke-width="20">
      <use href="#ltr-s"/><use href="#ltr-a"/><use href="#ltr-n"/><use href="#ltr-j"/><use href="#ltr-i"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="16">
      <use href="#ltr-s"/><use href="#ltr-a"/><use href="#ltr-n"/><use href="#ltr-j"/><use href="#ltr-i"/>
    </g>
    <g stroke="#0E0E0E" stroke-width="12">
      <use href="#ltr-s"/><use href="#ltr-a"/><use href="#ltr-n"/><use href="#ltr-j"/><use href="#ltr-i"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="8">
      <use href="#ltr-s"/><use href="#ltr-a"/><use href="#ltr-n"/><use href="#ltr-j"/><use href="#ltr-i"/>
    </g>
    <g stroke="#0E0E0E" stroke-width="4">
      <use href="#ltr-s"/><use href="#ltr-a"/><use href="#ltr-n"/><use href="#ltr-j"/><use href="#ltr-i"/>
    </g>
  </g>

  <!-- Teal stripes: multiply blend so they only colorize the white grooves
       (black gaps stay black; background stays black) -->
  <g style="mix-blend-mode: multiply">
    <rect x="0" y="107" width="690" height="5" fill="#2BB6C9"/>
    <rect x="0" y="127" width="690" height="5" fill="#2BB6C9"/>
  </g>

  <!-- Orange triangle accents tucked into each letter's pockets -->
  <g fill="#E8761B">
    <!-- S: upper-interior + lower-interior of the bowls -->
    <polygon points="85,71 79,82 91,82"/>
    <polygon points="95,158 89,169 101,169"/>
    <!-- A: paired inside the V at the foot -->
    <polygon points="220,176 214,187 226,187"/>
    <polygon points="260,176 254,187 266,187"/>
    <!-- N: upper-right pocket + lower-left pocket -->
    <polygon points="445,76 439,87 451,87"/>
    <polygon points="355,166 349,177 361,177"/>
    <!-- J: top + inside the hook -->
    <polygon points="535,76 529,87 541,87"/>
    <polygon points="525,170 519,181 531,181"/>
    <!-- I: flanking the vertical at midheight -->
    <polygon points="615,118 609,129 621,129"/>
    <polygon points="655,118 649,129 661,129"/>
  </g>
</svg>
